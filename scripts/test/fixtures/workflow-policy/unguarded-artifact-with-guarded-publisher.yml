name: Unguarded artifact with guarded publisher fixture

on:
  pull_request:

permissions:
  contents: read

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'devel' && github.event.pull_request.base.ref == 'main'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@0123456789012345678901234567890123456789
        with:
          persist-credentials: false
      - run: npm publish
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@0123456789012345678901234567890123456789
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@0123456789012345678901234567890123456789
        with:
          name: build-output
      - run: npm publish
