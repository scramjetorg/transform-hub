name: Release promotion admission

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-admission-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.repository == 'scramjetorg/transform-hub' && startsWith(github.event.pull_request.head.ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main
      - name: Read-only promotion verification
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin devel
          git show FETCH_HEAD:.github/release-train-lock.json > "$RUNNER_TEMP/release-train-lock.json"
          node - <<'NODE'
          const fs = require("node:fs"); const cp = require("node:child_process");
          const { validateLockAgainstPromotionMetadata } = require("./scripts/release-train-lock");
          const lock = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/release-train-lock.json"));
          const pr = JSON.parse(cp.execFileSync("gh", ["api", `repos/${process.env.GITHUB_REPOSITORY}/pulls/${process.env.PR_NUMBER}`], { encoding: "utf8" }));
          validateLockAgainstPromotionMetadata(lock, pr);
          if (pr.head.sha !== process.env.PR_HEAD_SHA) throw new Error("promotion head changed");
          NODE
