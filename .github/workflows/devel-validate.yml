name: Devel validation

on:
  push:
    branches: [devel]

permissions:
  contents: read

concurrency:
  group: devel-validation
  cancel-in-progress: true

jobs:
  package-build:
    name: Devel / package build
    if: ${{ github.repository == 'scramjetorg/transform-hub' && github.event_name == 'push' && github.ref == 'refs/heads/devel' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-workspace
        with:
          cache: "false"
          checkpoint-branch: devel

      - name: Build packages
        run: npm run build:packages

  ava:
    name: Devel / AVA
    if: ${{ github.repository == 'scramjetorg/transform-hub' && github.event_name == 'push' && github.ref == 'refs/heads/devel' }}
    needs: [package-build]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-workspace
        with:
          cache: "false"
          checkpoint-branch: devel

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1"

      - name: Run package tests
        run: npm run test:packages-no-concurrent

  bdd-node:
    name: Devel / BDD Node
    if: ${{ github.repository == 'scramjetorg/transform-hub' && github.event_name == 'push' && github.ref == 'refs/heads/devel' }}
    needs: [package-build]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-workspace
        with:
          cache: "false"
          checkpoint-branch: devel

      # Devel validation outputs remain disposable until trusted promotion exists.
      - name: Build disposable BDD inputs
        run: npm run build:packages

      - name: Run Docker-backed Node BDD validation
        run: npm run test:bdd-ci-node

  bdd-python:
    name: Devel / BDD Python
    if: ${{ github.repository == 'scramjetorg/transform-hub' && github.event_name == 'push' && github.ref == 'refs/heads/devel' }}
    needs: [package-build]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-workspace
        with:
          cache: "false"
          checkpoint-branch: devel

      # Devel validation outputs remain disposable until trusted promotion exists.
      - name: Build disposable BDD inputs
        run: npm run build:packages

      - name: Run Docker-backed Python BDD validation
        run: npm run test:bdd-ci-python

  bdd-api:
    name: Devel / BDD API
    if: ${{ github.repository == 'scramjetorg/transform-hub' && github.event_name == 'push' && github.ref == 'refs/heads/devel' }}
    needs: [package-build]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-workspace
        with:
          cache: "false"
          checkpoint-branch: devel

      # Devel validation outputs remain disposable until trusted promotion exists.
      - name: Build disposable BDD inputs
        run: npm run build:packages

      - name: Run Docker-backed API BDD validation
        run: npm run test:bdd-ci-api-node
