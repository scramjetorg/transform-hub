name: Devel validation

on:
  push:
    branches: [devel]

permissions:
  contents: read

concurrency:
  group: devel-validation
  cancel-in-progress: true

jobs:
  fast-gates:
    name: Devel / fast gates
    if: ${{ github.repository == 'scramjetorg/transform-hub' && github.event_name == 'push' && github.ref == 'refs/heads/devel' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Devel validation is fast-gates-only: it runs the non-build static gates
      # but never builds packages, runs package tests, installs Bun, or runs BDD.
      # The independent devel-bdd-image.yml publisher remains the provenance-
      # attested BDD image source required by Release PR prerelease BDD.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # Catch malformed package-lock.json before setup-workspace's npm ci.
      # Rebuilds the lock with the project-pinned npm via npx and fails on any diff.
      - name: Validate package-lock.json reproducibility
        run: npm run check:lockfile

      - uses: ./.github/actions/setup-workspace
        with:
          # Devel fast gates are trusted push code: read-write npm tarball cache.
          cache-mode: read-write
          checkpoint-branch: devel

      - name: Devel / release version
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          main_version="$(git show refs/remotes/origin/main:package.json | node -e 'const fs = require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(0, "utf8")).version)')"
          devel_version="$(node -p "require('./package.json').version")"
          node - "$devel_version" "$main_version" <<'NODE'
          const semver = require("semver");
          const [, , develVersion, mainVersion] = process.argv;
          const canonicalDevel = /^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)-devel$/;
          if (!canonicalDevel.test(develVersion)) throw new Error(`devel version is not canonical X.Y.Z-devel: ${develVersion}`);
          if (!semver.valid(mainVersion)) throw new Error(`main version is not valid SemVer: ${mainVersion}`);
          const stableDevel = develVersion.slice(0, -"-devel".length);
          if (!semver.gt(stableDevel, mainVersion)) throw new Error(`devel version ${develVersion} must be greater than main version ${mainVersion}`);
          NODE

      - name: Repository security policy
        run: npm run check:security-workflow

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Dependency and release alignment
        run: node scripts/release-align.js check-development --development-version="$(node -p "require('./package.json').version")"

      - name: Runtime invariants
        run: npm run check:runtime-invariants
