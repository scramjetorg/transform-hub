name: Release train start

on:
  workflow_dispatch:
    inputs:
      stable-version: { required: true, type: string, description: Stable release version }
      next-development-version: { required: true, type: string, description: Next stable version with -devel suffix }

permissions:
  contents: read

concurrency:
  group: release-train-start
  cancel-in-progress: false

jobs:
  release-start:
    name: Release train / start
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false, fetch-depth: 0, ref: devel }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: "22", cache: "" }
      - name: Validate inputs before mutation
        run: node scripts/release-align.js check --release-version="${{ inputs.stable-version }}"
      - name: Start release train
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-train.js start --repository "" --stable-version "${{ inputs.stable-version }}" --next-development-version "${{ inputs.next-development-version }}"
