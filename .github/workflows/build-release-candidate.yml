name: Build release candidate

on:
  push:
    branches: [devel]

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.repository == 'scramjetorg/transform-hub' && github.ref == 'refs/heads/devel' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      identity: ${{ steps.identity.outputs.identity }}
      identity-key: ${{ steps.identity.outputs.identity-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - id: identity
        name: Fail-closed protected remote preflight
        env:
          RELEASE_REMOTE_POLICY_CONFIRMED: ${{ vars.SCRAMJET_RELEASE_REMOTE_POLICY_CONFIRMED }}
        run: |
          node scripts/release-candidate-runtime.js preflight --repository "$GITHUB_REPOSITORY" --branch devel --source-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/candidate-identity.json" --require-policy-confirmation
          echo "identity=$(base64 -w 0 "$RUNNER_TEMP/candidate-identity.json")" >> "$GITHUB_OUTPUT"
          echo "identity-key=$(node -p "require(process.env.RUNNER_TEMP + '/candidate-identity.json').key")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: candidate-identity-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-identity.json
          if-no-files-found: error
          retention-days: 90

  runtime-images:
    needs: [preflight]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image-map: ${{ steps.images.outputs.image-map }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Prepare the outer runner artifact used by runtime images
        run: |
          npm ci
          node scripts/build-all.js --no-install --link-packages -d packages/runner -o ./dist/docker-runner/ --ts-config tsconfig.build.json
      - name: Authenticate Docker with GHCR for checkpoint consumption
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
      - name: Require the trusted runtime dependency checkpoint
        run: |
          node scripts/checkpoint/consume.js --branch devel --require-runtime-dependencies
          rm -rf runtime-dependencies
          cp -a "$CHECKPOINT_RUNTIME_DEPENDENCIES" runtime-dependencies
          test -s runtime-dependencies/manifest.v1.json
      - id: images
        name: Build and remotely verify the protected runtime-image closure
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io' EXIT
          build_image() { local role="$1" repo="$2" file="$3" context="$4"; local metadata="$RUNNER_TEMP/$role.json"; docker buildx build --push --platform linux/amd64 --build-arg CHECKPOINT_RUNTIME_DEPENDENCIES=true --file "$file" --tag "$repo:$GITHUB_SHA" --metadata-file "$metadata" "$context" >/dev/null; local digest; digest="$(jq -r '.["containerimage.digest"]' "$metadata")"; test "$digest" != null; docker buildx imagetools inspect "$repo@$digest" >/dev/null; printf '%s\t%s\t%s\n' "$role" "$repo" "$digest"; }
          { build_image bdd-node ghcr.io/scramjetorg/transform-hub/bdd-node docker/Dockerfile.bdd-bun .; build_image runner-node ghcr.io/scramjetorg/transform-hub/runner packages/runner/Dockerfile .; build_image runner-python ghcr.io/scramjetorg/transform-hub/runner-py packages/runner-python/Dockerfile .; build_image runner-bun ghcr.io/scramjetorg/transform-hub/runner-bun packages/runner-bun/Dockerfile .; build_image pre-runner ghcr.io/scramjetorg/transform-hub/pre-runner packages/pre-runner/Dockerfile packages/pre-runner; } > "$RUNNER_TEMP/images.tsv"
          node - "$RUNNER_TEMP/images.tsv" "$RUNNER_TEMP/runtime-images.json" <<'NODE'
          const fs = require("node:fs"); const out = {}; for (const line of fs.readFileSync(process.argv[2], "utf8").trim().split("\n")) { const [role, repository, digest] = line.split("\t"); out[role] = { repository, digest }; } fs.writeFileSync(process.argv[3], JSON.stringify(out));
          NODE
          echo "image-map=$(cat "$RUNNER_TEMP/runtime-images.json")" >> "$GITHUB_OUTPUT"

  build:
    needs: [preflight, runtime-images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release-set-digest: ${{ steps.bundle.outputs.release-set-digest }}
      state-key: ${{ needs.preflight.outputs.identity-key }}
      image-digest: ${{ steps.image.outputs.image-digest }}
      image-map: ${{ needs.runtime-images.outputs.image-map }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install dependencies
        run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-identity-${{ github.sha }}
          path: ${{ runner.temp }}/identity
      - id: image
        name: Require the immutable BDD image digest
        env:
          RELEASE_GHCR_IMAGE_DIGEST: ${{ vars.SCRAMJET_RELEASE_BDD_IMAGE_DIGEST }}
        run: |
          test -n "$RELEASE_GHCR_IMAGE_DIGEST"
          case "$RELEASE_GHCR_IMAGE_DIGEST" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 1 ;; esac
          echo "image-digest=$RELEASE_GHCR_IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Plan and perform the single credentialless build and pack
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.image-digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/candidate-bundle"
          node scripts/release-candidate-runtime.js locate --repository "$GITHUB_REPOSITORY" --tag "candidate-$GITHUB_SHA" --source-sha "$GITHUB_SHA" --identity "$RUNNER_TEMP/identity/candidate-identity.json" --output "$RUNNER_TEMP/locate.json"
           if test "$(node -p "require(process.env.RUNNER_TEMP + '/locate.json').status")" = "found"; then
             node scripts/release-candidate-runtime.js resolve --repository "$GITHUB_REPOSITORY" --tag "candidate-$GITHUB_SHA" --source-sha "$GITHUB_SHA" --identity "$RUNNER_TEMP/identity/candidate-identity.json" --release-id "$(node -p "require(process.env.RUNNER_TEMP + '/locate.json').releaseId")" --release-set-digest "$(node -p "require(process.env.RUNNER_TEMP + '/locate.json').releaseSetDigest")" --sealed-state-digest "$(node -p "require(process.env.RUNNER_TEMP + '/locate.json').sealedStateDigest")" --bundle-dir "$RUNNER_TEMP/candidate-bundle" --state "$RUNNER_TEMP/candidate-state.json" --output "$RUNNER_TEMP/resolve.json"
          else
            printf '%s' '${{ needs.runtime-images.outputs.image-map }}' > "$RUNNER_TEMP/image-map.json"
             node scripts/release-candidate-workflow.js plan --identity "$RUNNER_TEMP/identity/candidate-identity.json" --image-map "$RUNNER_TEMP/image-map.json" --output "$RUNNER_TEMP/release-set.json"
            node scripts/release-candidate-runtime.js build --root "$GITHUB_WORKSPACE" --bundle-dir "$RUNNER_TEMP/candidate-bundle" --state "$RUNNER_TEMP/candidate-state.json" --identity "$RUNNER_TEMP/identity/candidate-identity.json" --release-set "$RUNNER_TEMP/release-set.json"
          fi
      - id: bundle
        run: |
          cp "$RUNNER_TEMP/candidate-state.json" "$RUNNER_TEMP/candidate-bundle/candidate-state.json"
          cp "$RUNNER_TEMP/identity/candidate-identity.json" "$RUNNER_TEMP/candidate-bundle/candidate-identity.json"
          echo "release-set-digest=$(node -p "require('$RUNNER_TEMP/candidate-bundle/release-set.json').source.sha && require('./scripts/release-contract').digestDocument(require('$RUNNER_TEMP/candidate-bundle/release-set.json'))")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: candidate-bundle-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-bundle
          if-no-files-found: error
          retention-days: 90

  stage:
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.stage.outputs.release-id }}
      release-set-digest: ${{ steps.stage.outputs.release-set-digest }}
      sealed-state-digest: ${{ steps.stage.outputs.sealed-state-digest }}
      image-digest: ${{ steps.stage.outputs.image-digest }}
      image-map: ${{ steps.stage.outputs.image-map }}
    concurrency:
      group: candidate-staging-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-bundle-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-bundle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-identity-${{ github.sha }}
          path: ${{ runner.temp }}/identity
      - id: stage
        name: Stage candidate assets in one immutable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-candidate-runtime.js stage --repository "$GITHUB_REPOSITORY" --tag "candidate-$GITHUB_SHA" --source-sha "$GITHUB_SHA" --release-id 0 --bundle-dir "$RUNNER_TEMP/candidate-bundle" --state "$RUNNER_TEMP/candidate-bundle/candidate-state.json" --identity "$RUNNER_TEMP/identity/candidate-identity.json" --output "$RUNNER_TEMP/stage.json"
          echo "release-id=$(node -p "require(process.env.RUNNER_TEMP + '/stage.json').releaseId")" >> "$GITHUB_OUTPUT"
          echo "release-set-digest=$(node -p "require(process.env.RUNNER_TEMP + '/stage.json').releaseSetDigest")" >> "$GITHUB_OUTPUT"
          echo "sealed-state-digest=$(node -p "require(process.env.RUNNER_TEMP + '/stage.json').sealedStateDigest")" >> "$GITHUB_OUTPUT"
          echo "image-digest=$(node -p "require(process.env.RUNNER_TEMP + '/stage.json').imageDigest")" >> "$GITHUB_OUTPUT"
          echo "image-map=$(node -p 'JSON.stringify(require(process.env.RUNNER_TEMP + "/stage.json").imageMap)')" >> "$GITHUB_OUTPUT"

  curated-validation:
    needs: [preflight, build, stage]
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/curated-devel-build-validation.yml
    with:
      source-sha: ${{ github.sha }}
      candidate-release-id: ${{ needs.stage.outputs.release-id }}
      release-set-digest: ${{ needs.stage.outputs.release-set-digest }}
      image-digest: ${{ needs.stage.outputs.image-digest }}
      image-map: ${{ needs.stage.outputs.image-map }}
      sealed-state-digest: ${{ needs.stage.outputs.sealed-state-digest }}
      repository: ${{ github.repository }}
      candidate-tag: candidate-${{ github.sha }}

  candidate-success:
    needs: [preflight, build, stage, curated-validation]
    if: ${{ needs.curated-validation.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Persist candidate-success evidence after complete validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' '{"schema":"candidate-success-attestation.v1","candidateSuccess":true,"sourceSha":"${{ github.sha }}","candidateReleaseId":${{ needs.stage.outputs.release-id }},"releaseSetDigest":"${{ needs.stage.outputs.release-set-digest }}","sealedStateDigest":"${{ needs.stage.outputs.sealed-state-digest }}"}' > "$RUNNER_TEMP/candidate-success.json"
          node scripts/release-candidate-runtime.js attest --evidence "$RUNNER_TEMP/candidate-success.json" --output "$RUNNER_TEMP/candidate-success-attestation.json" --repository "$GITHUB_REPOSITORY" --tag "candidate-$GITHUB_SHA"
