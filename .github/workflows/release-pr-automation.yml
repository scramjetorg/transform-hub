name: Managed devel to main release PR

on:
  workflow_run:
    workflows: ["Devel validation"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: devel-main-pr-automation
  cancel-in-progress: false

jobs:
  manage-release-pr:
    name: Release PR / automation
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'devel' && github.event.workflow_run.head_repository.full_name == github.repository }}
    permissions:
      contents: read
      pull-requests: write
    environment: devel-main-pr-automation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Use the protected default branch automation code, not workflow-run head code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: ""

      - name: Create or update the managed release PR and request auto-merge
        env:
          # Environment secret: a GitHub App or fine-grained token limited to
          # pull-request creation/update and auto-merge requests, never admin bypass.
          GH_TOKEN: ${{ secrets.DEVEL_MAIN_PR_AUTOMATION_TOKEN }}
          RELEASE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RELEASE_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELEASE_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: node scripts/release-pr-automation.js
