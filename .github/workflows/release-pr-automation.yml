name: Release PR automation compatibility guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility-guard:
    name: Release PR / compatibility guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Explain migrated release automation
        run: node scripts/release-pr-automation.js
