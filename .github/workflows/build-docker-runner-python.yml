name: Build Runner Docker Image Python

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        default: '3.9'
        type: string
      git-revision:
        required: false
        default: ${{ github.sha }}
        type: string

jobs:
  build-docker-runner-python-image:
    name: Build runner-py docker image (Python ${{ inputs.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ inputs.git-revision }}

      - name: Setup Nodejs 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci --ignore-engines --prefer-offline --silent

      - name: Prepare Docker build context (runner JS tree + runner-python)
        run: |
          node scripts/build-all.js \
            --no-install \
            --link-packages \
            -d packages/runner \
            -o ./dist/docker-runner/ \
            --ts-config tsconfig.build.json
          cp -r packages/runner-python dist/docker-runner/runner-python

      - name: Build image
        run: docker build -t scramjetorg/runner-py:$(git rev-parse HEAD) -f packages/runner-python/Dockerfile .

      - name: Export image
        run: >
          docker images |
          awk '/scramjet/{print $1,$2,$3}' |
          sed 's|/| |' |
          while read repo name tag id; do
            docker save $repo/$name:$tag -o $repo-$name-$tag-docker-image.tar
          done

      - name: Install pigz and zip image
        run: |
          sudo apt-get install pigz -y
          pigz *-docker-image.tar

      - name: Upload image as an artifact
        uses: actions/upload-artifact@v3
        with:
          name: runner-python-image
          path: '*.tar.gz'
          retention-days: 1
