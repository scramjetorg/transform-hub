name: Pull request validation

on:
  pull_request:
    branches: [main, devel, "release/**"]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-validation-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  freeze-check:
    name: PR / devel release freeze
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'devel' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Reject devel changes while a release PR is open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! count="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --json headRefName,headRepository --jq "[.[] | select(.headRefName | startswith(\"release/\")) | select(.headRepository.fullName == \"$GITHUB_REPOSITORY\")] | length" 2>/dev/null)"; then
            message="FAIL: devel release-freeze status unavailable because the GitHub PR query failed."
            echo "$message Corrective action: Inspect GitHub CLI/API access and rerun the PR check." >&2
            printf '%s\n\n' "- $message" "  - Corrective action: Inspect GitHub CLI/API access and rerun the PR check." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$count" != 0 ]]; then
            message="FAIL: devel is frozen by $count trusted open release PR(s)."
            echo "$message Corrective action: Wait until the release PR is merged or closed." >&2
            printf '%s\n\n' "- $message" "  - Corrective action: Wait until the release PR is merged or closed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          message="PASS: devel release-freeze check found no trusted open release PR."
          echo "$message"
          printf '%s\n\n' "- $message" >> "$GITHUB_STEP_SUMMARY"

  validation:
    name: CI / full validation
    needs: [freeze-check]
    if: ${{ always() && (needs.freeze-check.result == 'success' || needs.freeze-check.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - name: Preliminary CI diagnostics
        env:
          RELEASE_BASE_REF: ${{ github.event.pull_request.base.ref }}
          RELEASE_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          RELEASE_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/lib/release-check-report.js pr
      - name: Verify devel PR is up to date
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'devel' }}
        run: git merge-base --is-ancestor origin/devel HEAD
      - name: Verify release PR admission
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "PASS: trusted release PR event/repository/base routing was confirmed by Preliminary CI diagnostics."
          echo "PASS: canonical version/branch and exact event-head checkout were confirmed by Preliminary CI diagnostics."
      - uses: ./.github/actions/setup-workspace
        with:
          cache-mode: restore-only
      - name: Verify release PR alignment
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          npm run release:align:check -- --release-version="$version"
      - name: Lockfile
        run: npm run check:lockfile
      - name: Security policy
        run: npm run check:security-workflow
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Runtime invariants
        run: npm run check:runtime-invariants
      - name: Development alignment and license validation
        if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'devel') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'devel') }}
        run: node scripts/release-align.js check-development --development-version="$(node -p "require('./package.json').version")"
      - name: Stable license validation
        if: ${{ !((github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'devel') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'devel')) }}
        run: npm run check:licenses
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1"
      - name: Package tests
        run: npm run test:packages:ci
      - name: Package build
        run: npm run build:packages

  bdd-core-node:
    name: CI / core Node BDD
    needs: [validation]
    if: ${{ always() && needs.validation.result == 'success' && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - uses: ./.github/actions/setup-workspace
        with:
          cache-mode: restore-only
      - name: Build BDD inputs
        run: npm run build:packages
      - name: Run core Node BDD
        env:
          BDD_DOCKER_MEMORY: 2g
          BDD_INCLUDE_LONG_RUNNING: "1"
        run: npm run test:bdd-ci-node

  bdd-core-services:
    name: CI / core service BDD
    needs: [validation]
    if: ${{ always() && needs.validation.result == 'success' && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - uses: ./.github/actions/setup-workspace
        with:
          cache-mode: restore-only
      - name: Build BDD inputs
        run: npm run build:packages
      - name: Run core service BDD
        run: |
          npm run test:bdd-ci-python
          npm run test:bdd-ci-api-node
          npm run test:bdd-ci-verser2
      - name: Run Verser2 full-path RPC E2E
        env:
          BDD_DOCKER_MEMORY: 3g
          BDD_INCLUDE_LONG_RUNNING: "1"
        run: node scripts/run-bdd.js -- features/e2e/E2E-022-si-manager-hub-instance-rpc.feature --format=pretty

  bdd-extended-hub-topic:
    name: CI / extended hub and topic BDD
    needs: [validation]
    if: ${{ always() && needs.validation.result == 'success' && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - uses: ./.github/actions/setup-workspace
        with:
          cache-mode: restore-only
      - name: Build BDD inputs
        run: npm run build:packages
      - name: Run extended hub and topic BDD
        run: |
          npm run test:bdd-ci-hub
          BDD_DOCKER_MEMORY=2g npm run test:bdd-ci-api-topic

  bdd-extended-runtime:
    name: CI / extended runtime BDD
    needs: [validation]
    if: ${{ always() && needs.validation.result == 'success' && !(github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - uses: ./.github/actions/setup-workspace
        with:
          cache-mode: restore-only
      - name: Build BDD inputs
        run: npm run build:packages
      - name: Run extended runtime BDD
        run: |
          BDD_DOCKER_MEMORY=2g BDD_INCLUDE_LONG_RUNNING=1 RUNTIME_ADAPTER=process npm run test:bdd-ci-node
          npm run test:unified-py
          npm run test:unified-js
