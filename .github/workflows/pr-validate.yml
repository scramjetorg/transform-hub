name: Pull request validation

on:
  pull_request:
    branches: [main, devel, "release/**"]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('merge-group-{0}', github.event.merge_group.head_sha) }}
  cancel-in-progress: true

jobs:
  package-validation:
    # Single source-validation job for every PR and merge-queue run: lockfile
    # reproducibility, fast gates, serial AVA package tests, and the package
    # build share one checkout/install so generic validation is never duplicated
    # by the release-specific jobs below.
    name: CI / package validation
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'devel' && github.event.pull_request.head.repo.full_name == github.repository && format('release-pr-{0}-package-validation', github.event.pull_request.number) || (github.event_name == 'pull_request' && format('pr-{0}-package-validation', github.event.pull_request.number)) || format('merge-group-{0}-package-validation', github.event.merge_group.head_sha) }}
      cancel-in-progress: true
    steps:
      # The protected organization-required security workflow remains mandatory.
      # This workflow never grants fork code credentials or promotion capability.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

      # Catch malformed package-lock.json before setup-workspace's npm ci.
      # Rebuilds the lock with the project-pinned npm via npx and fails on any diff.
      - name: Validate package-lock.json reproducibility
        run: npm run check:lockfile

      - uses: ./.github/actions/setup-workspace
        with:
          # PR/merge-group source jobs only restore a validated npm cache; they
          # never write caches from untrusted or release-PR code.
          cache-mode: restore-only
          checkpoint-branch: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || '' }}

      - name: Mergeability and merge-queue eligibility
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          case "$EVENT_NAME" in
            pull_request|merge_group) echo "GitHub event is eligible for required-check evaluation." ;;
            *) echo "Unsupported validation event: $EVENT_NAME" >&2; exit 1 ;;
          esac

      - name: Repository security policy
        run: npm run check:security-workflow

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Runtime invariants
        run: npm run check:runtime-invariants

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1"

      - name: Run package tests
        run: npm run test:packages:ci

      - name: Build packages
        run: npm run build:packages

      - name: Build the local SHA-tagged BDD Docker closure
        env:
          VALIDATION_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
          rm -rf dist/docker-runner
          mkdir -p runtime-dependencies
          node scripts/build-all.js --no-install --link-packages -d packages/runner -o ./dist/docker-runner/ --ts-config tsconfig.build.json
          cp -r packages/runner-python ./dist/docker-runner/runner-python
          docker build --file packages/runner/Dockerfile --tag "scramjetorg/runner:$VALIDATION_SHA" .
          docker build --file packages/runner-python/Dockerfile --tag "scramjetorg/runner-py:$VALIDATION_SHA" .
          docker build --file packages/runner-bun/Dockerfile --tag "scramjetorg/runner-bun:$VALIDATION_SHA" .
          docker build --file packages/pre-runner/Dockerfile --tag "scramjetorg/pre-runner:$VALIDATION_SHA" packages/pre-runner
          docker build --file docker/Dockerfile.bdd-bun --tag "ghcr.io/scramjetorg/transform-hub/bdd-node:$VALIDATION_SHA" .
          node - "$RUNNER_TEMP/pr-bdd-image-manifest.json" "$VALIDATION_SHA" <<'NODE'
          const fs = require("node:fs");
          const [,, output, sha] = process.argv;
          const images = [
            `scramjetorg/pre-runner:${sha}`,
            `scramjetorg/runner:${sha}`,
            `scramjetorg/runner-py:${sha}`,
            `scramjetorg/runner-bun:${sha}`,
            `ghcr.io/scramjetorg/transform-hub/bdd-node:${sha}`,
          ];
          fs.writeFileSync(output, JSON.stringify({ sourceSha: sha, tag: sha, bddImage: images[4], images }, null, 2));
          NODE
          docker save \
            "scramjetorg/pre-runner:$VALIDATION_SHA" \
            "scramjetorg/runner:$VALIDATION_SHA" \
            "scramjetorg/runner-py:$VALIDATION_SHA" \
            "scramjetorg/runner-bun:$VALIDATION_SHA" \
            "ghcr.io/scramjetorg/transform-hub/bdd-node:$VALIDATION_SHA" \
            | gzip > "$RUNNER_TEMP/pr-bdd-image-closure.tar.gz"

      - name: Upload disposable SHA-tagged BDD Docker closure
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: pr-bdd-image-closure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pr-bdd-image-closure.tar.gz
            ${{ runner.temp }}/pr-bdd-image-manifest.json
          retention-days: 1

  bdd-core-node:
    # Keep the two-resource @ci-runner-node scenarios isolated: their established
    # Docker requirement is 2 GiB and they are the longest core BDD path.
    name: CI / core Node BDD
    needs: [package-validation]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'devel' && github.event.pull_request.head.repo.full_name == github.repository && format('release-pr-{0}-bdd-core-node', github.event.pull_request.number) || (github.event_name == 'pull_request' && format('pr-{0}-bdd-core-node', github.event.pull_request.number)) || format('merge-group-{0}-bdd-core-node', github.event.merge_group.head_sha) }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

      - uses: ./.github/actions/setup-workspace
        with:
          # PR outputs remain disposable: restore-only cache, no build artifact
          # or node_modules handoff crosses jobs.
          cache-mode: restore-only
          checkpoint-branch: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || '' }}

      # PR outputs remain disposable: no build artifact or cache crosses jobs.
      - name: Build disposable BDD inputs
        run: npm run build:packages

      - name: Download the disposable SHA-tagged BDD Docker closure
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pr-bdd-image-closure-${{ github.run_id }}
          path: ${{ runner.temp }}/pr-bdd-image-closure

      - name: Load and verify the local SHA-tagged BDD Docker closure
        env:
          VALIDATION_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
          mkdir -p "$RUNNER_TEMP/pr-bdd-image-closure"
          test -s "$RUNNER_TEMP/pr-bdd-image-closure/pr-bdd-image-manifest.json"
          node - "$RUNNER_TEMP/pr-bdd-image-closure/pr-bdd-image-manifest.json" "$VALIDATION_SHA" <<'NODE'
          const fs = require("node:fs");
          const [,, manifestPath, sha] = process.argv;
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          if (manifest.sourceSha !== sha || manifest.tag !== sha || manifest.bddImage !== `ghcr.io/scramjetorg/transform-hub/bdd-node:${sha}` || !Array.isArray(manifest.images) || manifest.images.length !== 5 || manifest.images.some(image => !image.endsWith(`:${sha}`))) process.exit(1);
          NODE
          docker load --input "$RUNNER_TEMP/pr-bdd-image-closure/pr-bdd-image-closure.tar.gz"
          while IFS= read -r image; do docker image inspect "$image" >/dev/null; done < <(node -p 'require(process.argv[1]).images.join("\n")' "$RUNNER_TEMP/pr-bdd-image-closure/pr-bdd-image-manifest.json")
          echo "RUNNER_IMGS_TAG=$VALIDATION_SHA" >> "$GITHUB_ENV"
          echo "BDD_NODE_IMAGE=ghcr.io/scramjetorg/transform-hub/bdd-node:$VALIDATION_SHA" >> "$GITHUB_ENV"

      - name: Run Docker-backed Node BDD validation
        env:
          # @ci-runner-node scenarios start both suite and process-adapter
          # runner Hosts; their established Docker requirement is 2 GiB.
          BDD_DOCKER_MEMORY: 2g
          BDD_INCLUDE_LONG_RUNNING: "1"
        run: npm run test:bdd-ci-node

  bdd-core-services:
    # Python, API, and Verser2 cover distinct services and can run independently
    # from the Docker-backed Node lane above.
    name: CI / core service BDD
    needs: [package-validation]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'devel' && github.event.pull_request.head.repo.full_name == github.repository && format('release-pr-{0}-bdd-core-services', github.event.pull_request.number) || (github.event_name == 'pull_request' && format('pr-{0}-bdd-core-services', github.event.pull_request.number)) || format('merge-group-{0}-bdd-core-services', github.event.merge_group.head_sha) }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

      - uses: ./.github/actions/setup-workspace
        with:
          # PR outputs remain disposable: restore-only cache, no build artifact
          # or node_modules handoff crosses jobs.
          cache-mode: restore-only
          checkpoint-branch: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || '' }}

      - name: Build disposable BDD inputs
        run: npm run build:packages

      - name: Download the disposable SHA-tagged BDD Docker closure
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pr-bdd-image-closure-${{ github.run_id }}
          path: ${{ runner.temp }}/pr-bdd-image-closure

      - name: Load and verify the local SHA-tagged BDD Docker closure
        env:
          VALIDATION_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
          node - "$RUNNER_TEMP/pr-bdd-image-closure/pr-bdd-image-manifest.json" "$VALIDATION_SHA" <<'NODE'
          const fs = require("node:fs");
          const [,, manifestPath, sha] = process.argv;
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          if (manifest.sourceSha !== sha || manifest.tag !== sha || manifest.bddImage !== `ghcr.io/scramjetorg/transform-hub/bdd-node:${sha}` || !Array.isArray(manifest.images) || manifest.images.length !== 5 || manifest.images.some(image => !image.endsWith(`:${sha}`))) process.exit(1);
          NODE
          docker load --input "$RUNNER_TEMP/pr-bdd-image-closure/pr-bdd-image-closure.tar.gz"
          while IFS= read -r image; do docker image inspect "$image" >/dev/null; done < <(node -p 'require(process.argv[1]).images.join("\n")' "$RUNNER_TEMP/pr-bdd-image-closure/pr-bdd-image-manifest.json")
          echo "RUNNER_IMGS_TAG=$VALIDATION_SHA" >> "$GITHUB_ENV"
          echo "BDD_NODE_IMAGE=ghcr.io/scramjetorg/transform-hub/bdd-node:$VALIDATION_SHA" >> "$GITHUB_ENV"

      - name: Run Docker-backed Python BDD validation
        run: npm run test:bdd-ci-python

      - name: Run Docker-backed API BDD validation
        run: npm run test:bdd-ci-api-node

      - name: Run isolated Verser2 BDD validation
        run: npm run test:bdd-ci-verser2

  bdd-extended-hub-topic:
    # Hub and API-topic are the lightweight legacy-equivalent extended paths.
    name: CI / extended hub and topic BDD
    needs: [package-validation]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'devel' && github.event.pull_request.head.repo.full_name == github.repository && format('release-pr-{0}-bdd-extended-hub-topic', github.event.pull_request.number) || (github.event_name == 'pull_request' && format('pr-{0}-bdd-extended-hub-topic', github.event.pull_request.number)) || format('merge-group-{0}-bdd-extended-hub-topic', github.event.merge_group.head_sha) }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

      - uses: ./.github/actions/setup-workspace
        with:
          # PR outputs remain disposable: restore-only cache, no build artifact
          # or node_modules handoff crosses jobs.
          cache-mode: restore-only
          checkpoint-branch: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || '' }}

      # PR outputs remain disposable: build durable BDD inputs in this isolated job.
      - name: Build disposable BDD inputs
        run: npm run build:packages

      - name: Download the disposable SHA-tagged BDD Docker closure
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pr-bdd-image-closure-${{ github.run_id }}
          path: ${{ runner.temp }}/pr-bdd-image-closure

      - name: Load and verify the local SHA-tagged BDD Docker closure
        env:
          VALIDATION_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
          node - "$RUNNER_TEMP/pr-bdd-image-closure/pr-bdd-image-manifest.json" "$VALIDATION_SHA" <<'NODE'
          const fs = require("node:fs");
          const [,, manifestPath, sha] = process.argv;
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          if (manifest.sourceSha !== sha || manifest.tag !== sha || manifest.bddImage !== `ghcr.io/scramjetorg/transform-hub/bdd-node:${sha}` || !Array.isArray(manifest.images) || manifest.images.length !== 5 || manifest.images.some(image => !image.endsWith(`:${sha}`))) process.exit(1);
          NODE
          docker load --input "$RUNNER_TEMP/pr-bdd-image-closure/pr-bdd-image-closure.tar.gz"
          while IFS= read -r image; do docker image inspect "$image" >/dev/null; done < <(node -p 'require(process.argv[1]).images.join("\n")' "$RUNNER_TEMP/pr-bdd-image-closure/pr-bdd-image-manifest.json")
          echo "RUNNER_IMGS_TAG=$VALIDATION_SHA" >> "$GITHUB_ENV"
          echo "BDD_NODE_IMAGE=ghcr.io/scramjetorg/transform-hub/bdd-node:$VALIDATION_SHA" >> "$GITHUB_ENV"

      - name: Run hub BDD validation
        run: |
          npm run test:bdd-ci-hub
          BDD_DOCKER_MEMORY=2g npm run test:bdd-ci-api-topic

  bdd-extended-runtime:
    # Process-adapter and unified runtime coverage needs the same 2 GiB runner
    # allowance as core Node BDD, so it runs in its own parallel execution unit.
    name: CI / extended runtime BDD
    needs: [package-validation]
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'devel' && github.event.pull_request.head.repo.full_name == github.repository && format('release-pr-{0}-bdd-extended-runtime', github.event.pull_request.number) || (github.event_name == 'pull_request' && format('pr-{0}-bdd-extended-runtime', github.event.pull_request.number)) || format('merge-group-{0}-bdd-extended-runtime', github.event.merge_group.head_sha) }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

      - uses: ./.github/actions/setup-workspace
        with:
          # PR outputs remain disposable: restore-only cache, no build artifact
          # or node_modules handoff crosses jobs.
          cache-mode: restore-only
          checkpoint-branch: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref || '' }}

      - name: Build disposable BDD inputs
        run: npm run build:packages

      - name: Download the disposable SHA-tagged BDD Docker closure
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pr-bdd-image-closure-${{ github.run_id }}
          path: ${{ runner.temp }}/pr-bdd-image-closure

      - name: Load and verify the local SHA-tagged BDD Docker closure
        env:
          VALIDATION_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VALIDATION_SHA"
          node - "$RUNNER_TEMP/pr-bdd-image-closure/pr-bdd-image-manifest.json" "$VALIDATION_SHA" <<'NODE'
          const fs = require("node:fs");
          const [,, manifestPath, sha] = process.argv;
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          if (manifest.sourceSha !== sha || manifest.tag !== sha || manifest.bddImage !== `ghcr.io/scramjetorg/transform-hub/bdd-node:${sha}` || !Array.isArray(manifest.images) || manifest.images.length !== 5 || manifest.images.some(image => !image.endsWith(`:${sha}`))) process.exit(1);
          NODE
          docker load --input "$RUNNER_TEMP/pr-bdd-image-closure/pr-bdd-image-closure.tar.gz"
          while IFS= read -r image; do docker image inspect "$image" >/dev/null; done < <(node -p 'require(process.argv[1]).images.join("\n")' "$RUNNER_TEMP/pr-bdd-image-closure/pr-bdd-image-manifest.json")
          echo "RUNNER_IMGS_TAG=$VALIDATION_SHA" >> "$GITHUB_ENV"
          echo "BDD_NODE_IMAGE=ghcr.io/scramjetorg/transform-hub/bdd-node:$VALIDATION_SHA" >> "$GITHUB_ENV"

      - name: Run process-adapter and unified BDD validation
        run: |
          BDD_DOCKER_MEMORY=2g BDD_INCLUDE_LONG_RUNNING=1 RUNTIME_ADAPTER=process npm run test:bdd-ci-node
          npm run test:unified-py
          npm run test:unified-js
