name: Pull request validation

on:
  pull_request:
    branches: [main, devel, "release/**"]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  freeze-check:
    name: PR / devel release freeze
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'devel' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Reject devel changes while a release PR is open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --json headRefName,headRepository --jq --arg repository "$GITHUB_REPOSITORY" '[.[] | select(.headRefName | startswith("release/")) | select(.headRepository.fullName == $repository)] | length')"
          test "$count" = 0 || { echo "A release PR is open; devel is frozen." >&2; exit 1; }

  validation:
    name: CI / full validation
    needs: [freeze-check]
    if: ${{ always() && (needs.freeze-check.result == 'success' || needs.freeze-check.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - name: Verify devel PR is up to date
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'devel' }}
        run: git merge-base --is-ancestor origin/devel HEAD
      - name: Verify release PR admission
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="${{ github.event.pull_request.head.ref }}"
          version="$(node -p "require('./package.json').version")"
          test "$version" = "${branch#release/}"
          git merge-base --is-ancestor origin/main HEAD
          git merge-base --is-ancestor origin/devel HEAD
          npm run release:align:check -- --release-version="$version"
      - uses: ./.github/actions/setup-workspace
        with:
          cache-mode: restore-only
      - name: Lockfile
        run: npm run check:lockfile
      - name: Security policy
        run: npm run check:security-workflow
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Runtime invariants
        run: npm run check:runtime-invariants
      - name: License validation
        run: npm run check:licenses
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1"
      - name: Package tests
        run: npm run test:packages:ci
      - name: Package build
        run: npm run build:packages

  bdd-core-node:
    name: CI / core Node BDD
    needs: [validation]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - uses: ./.github/actions/setup-workspace
        with:
          cache-mode: restore-only
      - name: Build BDD inputs
        run: npm run build:packages
      - name: Run core Node BDD
        env:
          BDD_DOCKER_MEMORY: 2g
          BDD_INCLUDE_LONG_RUNNING: "1"
        run: npm run test:bdd-ci-node

  bdd-core-services:
    name: CI / core service BDD
    needs: [validation]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - uses: ./.github/actions/setup-workspace
        with:
          cache-mode: restore-only
      - name: Build BDD inputs
        run: npm run build:packages
      - name: Run core service BDD
        run: |
          npm run test:bdd-ci-python
          npm run test:bdd-ci-api-node
          npm run test:bdd-ci-verser2

  bdd-extended-hub-topic:
    name: CI / extended hub and topic BDD
    needs: [validation]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - uses: ./.github/actions/setup-workspace
        with:
          cache-mode: restore-only
      - name: Build BDD inputs
        run: npm run build:packages
      - name: Run extended hub and topic BDD
        run: |
          npm run test:bdd-ci-hub
          BDD_DOCKER_MEMORY=2g npm run test:bdd-ci-api-topic

  bdd-extended-runtime:
    name: CI / extended runtime BDD
    needs: [validation]
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - uses: ./.github/actions/setup-workspace
        with:
          cache-mode: restore-only
      - name: Build BDD inputs
        run: npm run build:packages
      - name: Run extended runtime BDD
        run: |
          BDD_DOCKER_MEMORY=2g BDD_INCLUDE_LONG_RUNNING=1 RUNTIME_ADAPTER=process npm run test:bdd-ci-node
          npm run test:unified-py
          npm run test:unified-js
