name: Pull request validation

on:
  pull_request:
    branches: [main, devel, "release/**"]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  freeze-check:
    name: PR / devel release freeze
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'devel' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Reject devel changes while a release PR is open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --json headRefName,headRepository --jq --arg repository "$GITHUB_REPOSITORY" '[.[] | select(.headRefName | startswith("release/")) | select(.headRepository.fullName == $repository)] | length')"
          test "$count" = 0 || { echo "A release PR is open; devel is frozen." >&2; exit 1; }

  validation:
    name: CI / full validation
    needs: [freeze-check]
    if: ${{ always() && (needs.freeze-check.result == 'success' || needs.freeze-check.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - name: Verify devel PR is up to date
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'devel' }}
        run: git merge-base --is-ancestor origin/devel HEAD
      - name: Verify release PR admission
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'release/') && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="${{ github.event.pull_request.head.ref }}"
          version="$(node -p "require('./package.json').version")"
          test "$version" = "${branch#release/}"
          git merge-base --is-ancestor origin/main HEAD
          git merge-base --is-ancestor origin/devel HEAD
          npm run release:align:check -- --release-version="$version"
      - uses: ./.github/actions/setup-workspace
        with:
          cache-mode: restore-only
      - name: Lockfile
        run: npm run check:lockfile
      - name: Security policy
        run: npm run check:security-workflow
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Runtime invariants
        run: npm run check:runtime-invariants
      - name: License validation
        run: npm run check:licenses
      - name: Package tests
        run: npm run test:packages:ci
      - name: Package build
        run: npm run build:packages
