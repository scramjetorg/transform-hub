name: Main production release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-production-release
  cancel-in-progress: false

jobs:
  production-publish:
    name: Release / production publish
    if: ${{ github.repository == 'scramjetorg/transform-hub' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: ./.github/actions/setup-workspace
        with:
          cache-mode: off

      - id: select
        name: Select and validate a draft release candidate (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          parents=($(git rev-list --parents -n 1 "$GITHUB_SHA"))
          if [ "${#parents[@]}" -ne 3 ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Ordinary main push; no release candidate selected."
            exit 0
          fi

          parent_two="${parents[2]}"
          main_tree="$(git rev-parse "$GITHUB_SHA^{tree}")"
          parent_two_tree="$(git rev-parse "$parent_two^{tree}")"
          releases_json="$RUNNER_TEMP/draft-releases.json"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases_json"
          candidate_json="$RUNNER_TEMP/release-candidate.json"
          node - "$releases_json" "$parent_two" "$main_tree" "$parent_two_tree" "$candidate_json" <<'NODE'
          const fs = require("node:fs");
          const [releasesPath, sourceSha, mainTree, sourceTree, outputPath] = process.argv.slice(2);
          const releases = JSON.parse(fs.readFileSync(releasesPath, "utf8"));
          const candidates = releases.filter((release) => release.draft && release.target_commitish === sourceSha);
          if (candidates.length === 0) {
              console.log("no-candidate");
              process.exit(0);
          }
          if (candidates.length !== 1) throw new Error("Exactly one draft release may target the apparent release source.");
          if (mainTree !== sourceTree) throw new Error("Apparent release merge does not preserve the draft source tree.");
          const candidate = candidates.find((release) => /^v\\d+\\.\\d+\\.\\d+$/.test(release.tag_name));
          if (!candidate) throw new Error("Draft release candidate must use a vX.Y.Z tag.");
          fs.writeFileSync(outputPath, JSON.stringify({ id: candidate.id, tag: candidate.tag_name, version: candidate.tag_name.slice(1), sourceSha }));
          console.log("candidate");
          NODE

          if [ ! -s "$candidate_json" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          release_tag="$(node -p "require('$candidate_json').tag")"
          release_version="$(node -p "require('$candidate_json').version")"
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh release download "$release_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern candidate-manifest.json \
            --pattern '*.tgz' \
            --dir "$RUNNER_TEMP/release-assets"
          node scripts/release-simple.js verify \
            --manifest "$RUNNER_TEMP/release-assets/candidate-manifest.json" \
            --source-sha "$parent_two" \
            --version "$release_version"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "source-sha=$parent_two" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Advance devel with a fast-forward-only update
        if: ${{ steps.select.outputs.release == 'true' }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin devel
          git merge-base --is-ancestor origin/devel "$GITHUB_SHA"
          git push origin "$GITHUB_SHA:refs/heads/devel"

      - name: Download and revalidate the draft release assets
        if: ${{ steps.select.outputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/release-assets"
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh release download "${{ steps.select.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --pattern candidate-manifest.json \
            --pattern '*.tgz' \
            --dir "$RUNNER_TEMP/release-assets"
          node scripts/release-simple.js verify \
            --manifest "$RUNNER_TEMP/release-assets/candidate-manifest.json" \
            --source-sha "${{ steps.select.outputs.source-sha }}" \
            --version "${{ steps.select.outputs.version }}"

      - name: Publish packages through npm trusted publishing
        if: ${{ steps.select.outputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test -z "${NPM_TOKEN:-}"
          test -z "${NODE_AUTH_TOKEN:-}"
          node scripts/release-simple.js publish \
            --manifest "$RUNNER_TEMP/release-assets/candidate-manifest.json" \
            --assets-dir "$RUNNER_TEMP/release-assets" \
            --source-sha "${{ steps.select.outputs.source-sha }}" \
            --version "${{ steps.select.outputs.version }}"
          node scripts/release-simple.js verify-registry \
            --manifest "$RUNNER_TEMP/release-assets/candidate-manifest.json" \
            --source-sha "${{ steps.select.outputs.source-sha }}" \
            --version "${{ steps.select.outputs.version }}"

      - name: Publish the same GitHub draft release
        if: ${{ steps.select.outputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ steps.select.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false
