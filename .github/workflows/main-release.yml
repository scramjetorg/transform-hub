name: Main production release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-production-release
  cancel-in-progress: false

jobs:
  release-admission:
    name: Release / read-only admission
    if: ${{ github.repository == 'scramjetorg/transform-hub' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      main-sha: ${{ steps.admission.outputs.main-sha }}
      candidate-source-sha: ${{ steps.admission.outputs.candidate-source-sha }}
      candidate-release-id: ${{ steps.admission.outputs.candidate-release-id }}
      release-set-digest: ${{ steps.admission.outputs.release-set-digest }}
      sealed-state-digest: ${{ steps.admission.outputs.sealed-state-digest }}
      admission-digest: ${{ steps.admission.outputs.admission-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-workspace
        with:
          cache-mode: restore-only
      - id: admission
        name: Fail closed on protected remote policy and admit the sealed candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRODUCTION_POLICY_CONFIRMED: ${{ vars.SCRAMJET_RELEASE_PRODUCTION_POLICY_CONFIRMED }}
          RELEASE_REMOTE_POLICY_CONFIRMED: ${{ vars.SCRAMJET_RELEASE_REMOTE_POLICY_CONFIRMED }}
        run: |
          set -euo pipefail
          test "$RELEASE_PRODUCTION_POLICY_CONFIRMED" = true
          test "$RELEASE_REMOTE_POLICY_CONFIRMED" = true
          mkdir -p "$RUNNER_TEMP/release-candidate"
          node scripts/release-candidate-runtime.js admit --repository "$GITHUB_REPOSITORY" --tag "candidate-$(git rev-parse HEAD^)" --source-sha "$(git rev-parse HEAD^)" --bundle-dir "$RUNNER_TEMP/release-candidate" --output "$RUNNER_TEMP/admission.json"
          node -e 'const { readFileSync } = require("node:fs"); const a = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/admission.json")); for (const [k,v] of Object.entries({"main-sha":process.env.GITHUB_SHA,"candidate-source-sha":a.sourceSha,"candidate-release-id":a.releaseId,"release-set-digest":a.releaseSetDigest,"sealed-state-digest":a.sealedStateDigest,"admission-digest":a.digest})) { if (v === undefined || v === null || v === "") throw new Error(k + " is missing"); console.log(`${k}=${v}`); }' >> "$GITHUB_OUTPUT"
          node -e 'const runtime = require("./scripts/release-production-runtime"); if (!runtime.admitMain) throw new Error("production admission contract is unavailable");'

  tarball-bdd:
    name: Release / tarball BDD
    needs: [release-admission]
    if: ${{ needs.release-admission.result == 'success' }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/tarball-release-validation.yml
    with:
      main-sha: ${{ needs.release-admission.outputs.main-sha }}
      candidate-source-sha: ${{ needs.release-admission.outputs.candidate-source-sha }}
      candidate-release-id: ${{ needs.release-admission.outputs.candidate-release-id }}
      release-set-digest: ${{ needs.release-admission.outputs.release-set-digest }}
      sealed-state-digest: ${{ needs.release-admission.outputs.sealed-state-digest }}

  production-publish:
    name: Release / production publish
    needs: [release-admission, tarball-bdd]
    if: ${{ needs.release-admission.result == 'success' && needs.tarball-bdd.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      journal-digest: ${{ steps.publish.outputs.journal-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.release-admission.outputs.main-sha }}
      - uses: ./.github/actions/setup-workspace
        with:
          cache-mode: off
      - id: publish
        name: Publish sealed tarballs through trusted publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRODUCTION_POLICY_CONFIRMED: ${{ vars.SCRAMJET_RELEASE_PRODUCTION_POLICY_CONFIRMED }}
          MAIN_RELEASE_PUBLISH_ENABLED: ${{ vars.SCRAMJET_MAIN_RELEASE_PUBLISH }}
          NPM_CONFIG_PROVENANCE: "true"
          CANDIDATE_RELEASE_ID: ${{ needs.release-admission.outputs.candidate-release-id }}
          RELEASE_SET_DIGEST: ${{ needs.release-admission.outputs.release-set-digest }}
          SEALED_STATE_DIGEST: ${{ needs.release-admission.outputs.sealed-state-digest }}
        run: |
          set -euo pipefail
          test "$RELEASE_PRODUCTION_POLICY_CONFIRMED" = true
          test "$MAIN_RELEASE_PUBLISH_ENABLED" = true
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test -z "${NPM_TOKEN:-}"
          test -z "${NODE_AUTH_TOKEN:-}"
          node scripts/release-candidate-runtime.js resolve --repository "$GITHUB_REPOSITORY" --tag "candidate-${{ needs.release-admission.outputs.candidate-source-sha }}" --source-sha "${{ needs.release-admission.outputs.candidate-source-sha }}" --release-id "$CANDIDATE_RELEASE_ID" --release-set-digest "$RELEASE_SET_DIGEST" --sealed-state-digest "$SEALED_STATE_DIGEST" --bundle-dir "$RUNNER_TEMP/release-candidate" --state "$RUNNER_TEMP/release-candidate/candidate-state.json" --output "$RUNNER_TEMP/candidate-resolve.json"
          RELEASE_VERSION="$(node -p "require(process.env.RUNNER_TEMP + '/release-candidate/release-set.json').artifacts.tarballs[0].version")"
          node scripts/release-production-runtime.js publish-main --repository "$GITHUB_REPOSITORY" --candidate-tag "candidate-${{ needs.release-admission.outputs.candidate-source-sha }}" --bundle-dir "$RUNNER_TEMP/release-candidate" --main-sha "${{ needs.release-admission.outputs.main-sha }}" --source-sha "${{ needs.release-admission.outputs.candidate-source-sha }}" --candidate-release-id "$CANDIDATE_RELEASE_ID" --release-set-digest "$RELEASE_SET_DIGEST" --sealed-state-digest "$SEALED_STATE_DIGEST" --version "$RELEASE_VERSION" --output "$RUNNER_TEMP/release-candidate/publication-journal-final.json"
          echo "journal-digest=$(node -e 'const { digestDocument } = require("./scripts/release-contract"); const fs = require("node:fs"); const p = process.env.RUNNER_TEMP + "/release-candidate/publication-journal-final.json"; process.stdout.write(digestDocument(JSON.parse(fs.readFileSync(p))));')" >> "$GITHUB_OUTPUT"

  registry-proof:
    name: Release / read-only registry proof
    needs: [release-admission, tarball-bdd, production-publish]
    if: ${{ needs.production-publish.result == 'success' }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/production-registry-verification.yml
    with:
      main-sha: ${{ needs.release-admission.outputs.main-sha }}
      candidate-source-sha: ${{ needs.release-admission.outputs.candidate-source-sha }}
      candidate-release-id: ${{ needs.release-admission.outputs.candidate-release-id }}
      release-set-digest: ${{ needs.release-admission.outputs.release-set-digest }}
      sealed-state-digest: ${{ needs.release-admission.outputs.sealed-state-digest }}
      journal-digest: ${{ needs.production-publish.outputs.journal-digest }}

  release-finalization:
    name: Release / finalization
    needs: [release-admission, tarball-bdd, production-publish, registry-proof]
    if: ${{ needs.registry-proof.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.release-admission.outputs.main-sha }}
      - uses: ./.github/actions/setup-workspace
        with:
          cache-mode: restore-only
      - name: Resolve candidate assets before finalization
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-finalizer-candidate"
          node scripts/release-candidate-runtime.js resolve --repository "$GITHUB_REPOSITORY" --tag "candidate-${{ needs.release-admission.outputs.candidate-source-sha }}" --source-sha "${{ needs.release-admission.outputs.candidate-source-sha }}" --release-id "${{ needs.release-admission.outputs.candidate-release-id }}" --release-set-digest "${{ needs.release-admission.outputs.release-set-digest }}" --sealed-state-digest "${{ needs.release-admission.outputs.sealed-state-digest }}" --bundle-dir "$RUNNER_TEMP/release-finalizer-candidate" --state "$RUNNER_TEMP/release-finalizer-candidate/candidate-state.json" --output "$RUNNER_TEMP/finalizer-resolve.json"
      - name: Finalize the digest-bound release set
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ needs.release-admission.outputs.main-sha }}
          CANDIDATE_RELEASE_ID: ${{ needs.release-admission.outputs.candidate-release-id }}
          RELEASE_SET_DIGEST: ${{ needs.release-admission.outputs.release-set-digest }}
          SEALED_STATE_DIGEST: ${{ needs.release-admission.outputs.sealed-state-digest }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="$(node -p "require(process.env.RUNNER_TEMP + '/release-finalizer-candidate/release-set.json').artifacts.tarballs[0].version")"
          node scripts/release-finalizer.js --repository "$GITHUB_REPOSITORY" --candidate-tag "candidate-${{ needs.release-admission.outputs.candidate-source-sha }}" --final-tag "v$RELEASE_VERSION" --version "$RELEASE_VERSION" --main-sha "$MAIN_SHA" --candidate-release-id "$CANDIDATE_RELEASE_ID" --sealed-state-digest "$SEALED_STATE_DIGEST" --release-set-digest "$RELEASE_SET_DIGEST" --journal-digest "${{ needs.production-publish.outputs.journal-digest }}" --registry-verification-digest "${{ needs.registry-proof.outputs.registry-proof-digest }}"
