name: Publish stable tag
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      stable_tag:
        description: Existing stable tag to recover (vX.Y.Z)
        required: true
        type: string
      expected_tag_sha:
        description: Recorded peeled stable-tag commit SHA (40 hex)
        required: true
        type: string
      expected_bundle_checksum:
        description: Optional recorded manifest outerChecksum (sha256:64 hex)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ format('tag-{0}', github.event_name == 'workflow_dispatch' && inputs.stable_tag || github.ref_name) }}
  cancel-in-progress: false
jobs:
  admission:
    name: Validate publication admission
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Validate publication event and ref
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REPOSITORY" != "scramjetorg/transform-hub" ]]; then
            echo "::error::Publication is restricted to scramjetorg/transform-hub."
            exit 1
          fi
          if [[ "$RELEASE_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
              echo "::error::Recovery dispatch must run on refs/heads/main; observed ref=$RELEASE_REF. No production/OIDC job was admitted."
              exit 1
            fi
          elif [[ "$RELEASE_EVENT_NAME" == "push" ]]; then
            if [[ ! "$RELEASE_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Stable publication requires a canonical stable version tag; observed ref=$RELEASE_REF."
              exit 1
            fi
          else
            echo "::error::Unsupported publication event; observed event=$RELEASE_EVENT_NAME."
            exit 1
          fi
          if [[ "${RELEASE_REF_PROTECTED:-}" != "true" ]]; then
            echo "::error::Publication requires a protected Git ref; observed ref=$RELEASE_REF."
            exit 1
          fi
          echo "Admitted publication event=$RELEASE_EVENT_NAME ref=$RELEASE_REF"
  publish:
    needs: admission
    if: ${{ needs.admission.result == 'success' && github.repository == 'scramjetorg/transform-hub' && github.ref_protected && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned npm
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts npm@11.19.0
          test "$(npm --version)" = "11.19.0"
      - run: npm ci --ignore-scripts
      - name: Resolve immutable publication identity
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          node scripts/release-main.js resolve-publication --output "$RUNNER_TEMP/release-identity.json"
          echo "run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
          node --version
          npm --version
          node node_modules/npm/bin/npm-cli.js --version
      - name: Download selected release assets into clean directory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release-main.js download-assets --identity "$RUNNER_TEMP/release-identity.json" --bundle "$RUNNER_TEMP/release-bundle" --assets-json "$RUNNER_TEMP/release-assets.json"
      - name: Fully verify bundle and finalize GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release-main.js finalize-release --identity "$RUNNER_TEMP/release-identity.json" --bundle "$RUNNER_TEMP/release-bundle" --assets-json "$RUNNER_TEMP/release-assets.json"
      - name: Publish verified npm tarballs
        env:
          MAIN_RELEASE_PUBLISH_ENABLED: "true"
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          node scripts/release-main.js publish --identity "$RUNNER_TEMP/release-identity.json" --bundle "$RUNNER_TEMP/release-bundle" --tarballs-dir "$RUNNER_TEMP/release-bundle/tarballs" --assets-json "$RUNNER_TEMP/release-assets.json"
